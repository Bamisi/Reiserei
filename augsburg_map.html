function makeIcon(color, iconType, num) {
  const label = num != null ? num : '';
  let svg, w, h, ax, ay;

  if (iconType === 'camera') {
    w = 36; h = 28; ax = 18; ay = 14;
    svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 28" width="36" height="28">
      <rect x="12" y="1" width="12" height="6" rx="2" fill="${color}" stroke="rgba(0,0,0,0.35)" stroke-width="1.5"/>
      <rect x="1" y="6" width="34" height="21" rx="3" fill="${color}" stroke="rgba(0,0,0,0.35)" stroke-width="1.5"/>
      <circle cx="18" cy="17" r="8" fill="white" opacity="0.95"/>
      <text x="18" y="21" font-family="Arial" font-weight="900" font-size="10" text-anchor="middle" fill="${color}">${label}</text>
    </svg>`;

  } else if (iconType === 'museum') {
    w = 44; h = 36; ax = 22; ay = 18;
    svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 36" width="44" height="36">
      <polygon points="2,16 22,1 42,16" fill="${color}" stroke="rgba(0,0,0,0.35)" stroke-width="1.5" stroke-linejoin="round"/>
      <rect x="4" y="16" width="36" height="14" fill="${color}"/>
      <rect x="2" y="30" width="40" height="5" rx="1" fill="${color}" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
      <line x1="13" y1="16" x2="13" y2="30" stroke="rgba(0,0,0,0.2)" stroke-width="2"/>
      <line x1="22" y1="16" x2="22" y2="30" stroke="rgba(0,0,0,0.2)" stroke-width="2"/>
      <line x1="31" y1="16" x2="31" y2="30" stroke="rgba(0,0,0,0.2)" stroke-width="2"/>
      <rect x="4" y="16" width="36" height="19" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="1"/>
      <text x="22" y="27" font-family="Arial" font-weight="900" font-size="11" text-anchor="middle" fill="white">${label}</text>
    </svg>`;

  } else if (iconType === 'dragon') {
    w = 38; h = 38; ax = 19; ay = 19;
    svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38" width="38" height="38">
      <path d="M5,34 C3,29 3,22 5,16 C8,9 13,5 19,4 C24,3 29,5 33,10 C36,14 37,20 35,26 C33,31 28,35 22,36 L10,36 Z" fill="${color}" stroke="rgba(0,0,0,0.35)" stroke-width="1.5"/>
      <polygon points="18,4 15,1 22,3" fill="${color}" stroke="rgba(0,0,0,0.3)" stroke-width="1" stroke-linejoin="round"/>
      <circle cx="26" cy="13" r="3" fill="white" opacity="0.85"/>
      <circle cx="27" cy="13" r="1.5" fill="${color}"/>
      <text x="16" y="28" font-family="Arial" font-weight="900" font-size="11" text-anchor="middle" fill="white">${label}</text>
    </svg>`;

  } else if (iconType === 'book') {
    w = 26; h = 34; ax = 13; ay = 17;
    svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 34" width="26" height="34">
      <rect x="1" y="1" width="24" height="32" rx="2" fill="${color}" stroke="rgba(0,0,0,0.4)" stroke-width="1.5"/>
      <rect x="1" y="1" width="6" height="32" rx="2" fill="rgba(0,0,0,0.2)"/>
      <line x1="9" y1="10" x2="23" y2="10" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
      <line x1="9" y1="15" x2="23" y2="15" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
      <line x1="9" y1="20" x2="23" y2="20" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
      <text x="16" y="30" font-family="Arial" font-weight="900" font-size="11" text-anchor="middle" fill="white">${label}</text>
    </svg>`;

  } else if (iconType === 'house') {
    w = 38; h = 37; ax = 19; ay = 19;
    svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 37" width="38" height="37">
      <polygon points="1,18 19,1 37,18" fill="${color}" stroke="rgba(0,0,0,0.35)" stroke-width="1.5" stroke-linejoin="round"/>
      <rect x="4" y="17" width="30" height="19" rx="1" fill="${color}" stroke="rgba(0,0,0,0.3)" stroke-width="1.2"/>
      <rect x="6" y="20" width="7" height="5" rx="1" fill="rgba(255,255,255,0.3)"/>
      <rect x="25" y="20" width="7" height="5" rx="1" fill="rgba(255,255,255,0.3)"/>
      <rect x="14" y="28" width="10" height="8" rx="1" fill="rgba(0,0,0,0.2)"/>
      <text x="19" y="27" font-family="Arial" font-weight="900" font-size="11" text-anchor="middle" fill="white">${label}</text>
    </svg>`;

  } else if (iconType === 'fork') {
    w = 22; h = 38; ax = 11; ay = 19;
    svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 38" width="22" height="38">
      <rect x="2" y="1" width="4" height="14" rx="2" fill="${color}" stroke="rgba(0,0,0,0.35)" stroke-width="1"/>
      <rect x="9" y="1" width="4" height="14" rx="2" fill="${color}" stroke="rgba(0,0,0,0.35)" stroke-width="1"/>
      <rect x="16" y="1" width="4" height="14" rx="2" fill="${color}" stroke="rgba(0,0,0,0.35)" stroke-width="1"/>
      <rect x="2" y="13" width="18" height="5" rx="1" fill="${color}" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
      <rect x="7" y="17" width="8" height="20" rx="4" fill="${color}" stroke="rgba(0,0,0,0.35)" stroke-width="1.2"/>
      <text x="11" y="32" font-family="Arial" font-weight="900" font-size="9" text-anchor="middle" fill="white">${label}</text>
    </svg>`;

  } else if (iconType === 'speaker') {
    w = 32; h = 32; ax = 16; ay = 16;
    svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
      <rect x="1" y="9" width="11" height="14" rx="1.5" fill="${color}" stroke="rgba(0,0,0,0.35)" stroke-width="1.5"/>
      <path d="M12,9 L12,23 L28,29 L28,3 Z" fill="${color}" stroke="rgba(0,0,0,0.35)" stroke-width="1.5" stroke-linejoin="round"/>
      <text x="6.5" y="19" font-family="Arial" font-weight="900" font-size="10" text-anchor="middle" fill="white">${label}</text>
    </svg>`;

  } else {
    let inner;
    if (num != null) {
      const fs = num >= 10 ? 8 : 9;
      inner = `<circle cx="12" cy="12" r="6.5" fill="white" opacity="0.95"/>
    <text x="12" y="16" font-family="Arial" font-weight="900" font-size="${fs}" text-anchor="middle" fill="${color}">${num}</text>`;
    } else if (iconType === 'star') {
      inner = `<polygon points="12,5 13.5,9.5 18.5,9.5 14.5,12.3 16,17 12,14 8,17 9.5,12.3 5.5,9.5 10.5,9.5" fill="white" opacity="0.95"/>`;
    } else if (iconType === 'parking') {
      inner = `<text x="12" y="17" font-family="Arial" font-weight="900" font-size="13" text-anchor="middle" fill="white">P</text>`;
    } else {
      inner = `<circle cx="12" cy="12" r="5" fill="white" opacity="0.9"/>`;
    }
    const size = iconType ? [28, 40] : [24, 36];
    const anch = iconType ? [14, 40] : [12, 36];
    svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 36" width="${size[0]}" height="${size[1]}">
    <path d="M12 0C5.37 0 0 5.37 0 12c0 9 12 24 12 24S24 21 24 12C24 5.37 18.63 0 12 0z"
      fill="${color}" stroke="rgba(0,0,0,0.35)" stroke-width="1.5"/>
    ${inner}
  </svg>`;
    return L.divIcon({ html: svg, className: '', iconSize: size, iconAnchor: anch, popupAnchor: [0, -42] });
  }

  return L.divIcon({ html: svg, className: '', iconSize: [w, h], iconAnchor: [ax, ay], popupAnchor: [0, -(ay + 6)] });
}

STATIONS.forEach(st => {
  const src = SRC[st.src];
  const also = (st.also || []).map(id => SRC[id]);
  const alsoHtml = also.length
    ? `<div class="popup-source">Auch in: ${also.map(s => `<span style="color:${s.color};font-weight:600">${s.label}</span>`).join(', ')}</div>`
    : '';
  const noteHtml = st.note ? `<div class="popup-note">⚠ ${st.note}</div>` : '';
  const audioHtml = st.audio
    ? `<audio controls style="width:100%;margin-top:8px;height:36px"><source src="${st.audio}" type="audio/mpeg"></audio>`
    : '';

  const popup = `
    <b>${st.name}</b>
    <div class="popup-source">${st.desc}</div>
    ${audioHtml}
    ${noteHtml}
    <div style="margin-top:5px">
      <span class="popup-badge" style="background:${src.color}">${src.label}</span>
    </div>
    ${alsoHtml}
  `;

  L.marker([st.lat, st.lng], { icon: makeIcon(src.color, src.iconType, st.order) })
    .bindPopup(popup, { maxWidth: 260 })
    .addTo(layers[st.src]);
});

// ── Walking routes via OSRM ──────────────────────────────────────────────────
SOURCES.forEach(async src => {
  const ordered = STATIONS
    .filter(s => s.src === src.id && s.order != null)
    .sort((a, b) => a.order - b.order);
  if (ordered.length < 2) return;

  const coords = ordered.map(s => `${s.lng},${s.lat}`).join(';');
  try {
    const res = await fetch(
      `https://routing.openstreetmap.de/routed-foot/route/v1/foot/${coords}?overview=full&geometries=geojson`
    );
    const data = await res.json();
    if (data.routes?.[0]?.geometry?.coordinates) {
      const latlngs = data.routes[0].geometry.coordinates.map(([lng, lat]) => [lat, lng]);
      L.polyline(latlngs, {
        color: src.color, weight: 3, opacity: 0.65, dashArray: '7,5'
      }).addTo(layers[src.id]);
    }
  } catch (e) {
    console.warn('Route fetch failed:', src.id, e);
  }
});
const uniqueCount = STATIONS.length;
const uniqueLocations = new Set(STATIONS.map(s => `${s.lat},${s.lng}`)).size;
document.getElementById('count-badge').textContent =
  `6 Quellen · ${uniqueCount} Einträge (${uniqueLocations} Standorte) · v0.9`;

// ── Legend ───────────────────────────────────────────────────────────────────
const legendCtrl = L.control({ position: 'bottomleft' });
legendCtrl.onAdd = function () {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = '<h4>Quellen <small style="color:#aaa;font-weight:normal">(klicken zum Ein-/Ausblenden)</small></h4>';
  const body = document.createElement('div');
  body.className = 'legend-body';
  div.appendChild(body);

  div.querySelector('h4').addEventListener('click', () => div.classList.toggle('collapsed'));

  SOURCES.forEach(s => {
    const count = STATIONS.filter(st => st.src === s.id).length;
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.dataset.id = s.id;
    item.innerHTML = `
      <div class="legend-dot" style="background:${s.color}"></div>
      <span>${s.label} <small style="color:#999">(${count})</small></span>
    `;
    item.addEventListener('click', () => {
      const visible = map.hasLayer(layers[s.id]);
      if (visible) { map.removeLayer(layers[s.id]); item.classList.add('hidden'); }
      else          { map.addLayer(layers[s.id]);    item.classList.remove('hidden'); }
    });
    body.appendChild(item);
    if (s.urls && s.urls.length) {
      const links = document.createElement('div');
      links.style.cssText = 'padding-left:22px; margin-bottom:2px;';
      links.innerHTML = s.urls.map(u =>
        `<a href="${u.href}" target="_blank" style="font-size:0.65rem;color:#2b7de9;margin-right:8px;text-decoration:none;">↗ ${u.label}</a>`
      ).join('');
      L.DomEvent.disableClickPropagation(links);
      body.appendChild(links);
    }  });

  const note = document.createElement('p');
  note.style.cssText = 'font-size:0.68rem;color:#aaa;margin-top:8px;line-height:1.4;border-top:1px solid #eee;padding-top:6px';
  note.innerHTML = '⚠ Koordinaten sind Näherungswerte.<br>★ = Unterkunft · <b>P</b> = Parkplatz<br>Augustusbrunnen erscheint in 2 Layern.';
  body.appendChild(note);

  const guide = document.createElement('div');
  guide.style.cssText = 'margin-top:6px;padding-top:6px;border-top:1px solid #eee;';
  guide.innerHTML = '<a href="https://www.augsburg-tourismus.de/files/augsburgtourismus/media/infomaterial/pdf/2023/regio_stadtspaziergaenge_augsburg_2023_web.pdf" target="_blank" style="font-size:0.7rem;color:#2b7de9;text-decoration:none;">↗ Stadtspaziergänge Augsburg (PDF)</a>';
  L.DomEvent.disableClickPropagation(guide);
  body.appendChild(guide);

  L.DomEvent.disableClickPropagation(div);
  return div;
};
legendCtrl.addTo(map);

// ── Standort-Button ──────────────────────────────────────────────────────────
let locationMarker = null;
document.getElementById('locate-btn').addEventListener('click', () => {
  if (!navigator.geolocation) { alert('Geolocation wird nicht unterstützt.'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude: lat, longitude: lng } = pos.coords;
    if (locationMarker) locationMarker.remove();
    locationMarker = L.circleMarker([lat, lng], {
      radius: 10, color: '#0057ff', fillColor: '#4d94ff',
      fillOpacity: 0.85, weight: 3
    }).addTo(map).bindPopup('📍 Dein Standort');
    map.setView([lat, lng], 16);
  }, err => {
    const msg = {
      1: 'Standortzugriff verweigert – bitte in den iPhone-Einstellungen unter Datenschutz → Ortungsdienste → Safari erlauben.',
      2: 'Standort konnte nicht ermittelt werden (kein GPS-Signal).',
      3: 'Zeitüberschreitung – bitte nochmal versuchen.',
    };
    alert(msg[err.code] || `Fehler ${err.code}: ${err.message}`);
  });
});
</script>
